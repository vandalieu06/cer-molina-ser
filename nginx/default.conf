server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Detrás de Traefik (que termina TLS) los redirects deben ser relativos:
    # si no, nginx los emitiría como http:// y provocaría un salto extra/loop.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Assets con hash en el nombre: cache agresivo
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML: revalidar siempre (los deploys sustituyen los ficheros)
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # 404 propia de Astro (dist/404.html); los directorios sin índice también caen aquí
    error_page 403 404 /404.html;
    location = /404.html {
        internal;
    }
}
